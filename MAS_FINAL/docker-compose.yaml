services:
  db:
    image: postgres:16
    container_name: karent-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: karent
      POSTGRES_USER: karent
      POSTGRES_PASSWORD: karent
    ports:
      - "5433:5432"
    volumes:
      - karent_pgdata:/var/lib/postgresql/data

volumes:
  karent_pgdata: {}
